<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Bunk Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #111827; /* bg-gray-900 */
            color: #D1D5DB; /* text-gray-300 */
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
        }
        h1 {
            color: #F9FAFB; /* text-gray-50 */
            border-bottom: 1px solid #374151; /* border-gray-700 */
            padding-bottom: 0.5rem;
            margin-bottom: 1rem;
        }
        p {
            margin-bottom: 1rem;
            line-height: 1.6;
        }
        a {
            color: #60A5FA; /* text-blue-400 */
            font-weight: 500;
        }
        a:hover {
            text-decoration: underline;
        }
        .card {
            background-color: #1f2937; /* bg-gray-800 */
            padding: 2rem;
            border-radius: 0.5rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container mt-10">
        <div class="card">
            <h1 class="text-3xl font-bold">Contact Us</h1>
            <p class="text-lg">
                If you have any questions, feedback, or concerns about Bunk Control, please don't hesitate to reach out.
            </p>
            <p class="text-lg">
                You can contact us via email at: 
                <a href="mailto:support@bunkcontrol.app">support@bunkcontrol.app</a>
            </p>
            <div class="mt-8">
                <a href="/" class="text-blue-400 hover:text-blue-300 transition-colors">&larr; Back to Home</a>
            </div>
        </div>
    </div>
</body>
</html>
