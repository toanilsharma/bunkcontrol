<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bunk Control 🚀</title>
    
    <!-- Optimization: Preconnect to CDNs -->
    <link rel="preconnect" href="https://cdn.tailwindcss.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://esm.sh">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-KGM97YW8Z6"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-KGM97YW8Z6');
    </script>

    <!-- Tailwind CSS CDN for modern styling with plugins -->
    <script src="https://cdn.tailwindcss.com?plugins=typography,forms,aspect-ratio"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            typography: (theme) => ({
              DEFAULT: {
                css: {
                  color: theme('colors.gray.700'),
                  a: {
                    color: theme('colors.blue.600'),
                    '&:hover': {
                      color: theme('colors.blue.700'),
                    },
                  },
                },
              },
              dark: {
                css: {
                  color: theme('colors.gray.300'),
                  a: {
                    color: theme('colors.blue.400'),
                    '&:hover': {
                      color: theme('colors.blue.300'),
                    },
                  },
                  h1: { color: theme('colors.white') },
                  h2: { color: theme('colors.white') },
                  h3: { color: theme('colors.white') },
                  h4: { color: theme('colors.white') },
                  strong: { color: theme('colors.white') },
                  code: { color: theme('colors.gray.300') },
                  blockquote: { color: theme('colors.gray.100') },
                },
              },
            }),
          },
        },
      }
    </script>
    <!-- jsPDF for client-side PDF generation (Deferred) -->
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- SheetJS for Excel/CSV Import/Export (Deferred) -->
    <script defer src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        
        /* Color utilities for React components */
        .bg-safe { background-color: #22c55e; } /* green-500 */
        .bg-warning { background-color: #f59e0b; } /* amber-500 */
        .bg-danger { background-color: #ef4444; } /* red-500 */
        .text-safe { color: #22c55e; }
        .text-warning { color: #f59e0b; }
        .text-danger { color: #ef4444; }

        /* Animation utilities for React components */
        @keyframes fade-in {
          from { opacity: 0; }
          to { opacity: 1; }
        }
        .animate-fade-in {
          animation: fade-in 0.5s ease-out forwards;
        }

        @keyframes scale-in {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .animate-scale-in {
            animation: scale-in 0.2s ease-out forwards;
        }
        
        @keyframes slide-up {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .animate-slide-up {
            animation: slide-up 0.3s ease-out forwards;
        }

        /* Card update animations */
        @keyframes flash-green {
          50% { transform: scale(1.02); box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.5); }
        }
        .animate-flash-green { animation: flash-green 0.5s ease-out; }

        @keyframes flash-red {
          50% { transform: scale(1.02); box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.5); }
        }
        .animate-flash-red { animation: flash-red 0.5s ease-out; }
        
        @keyframes flash-gray {
          50% { transform: scale(1.02); box-shadow: 0 0 0 4px rgba(107, 114, 128, 0.5); }
        }
        .animate-flash-gray { animation: flash-gray 0.5s ease-out; }
    </style>
    <script type="importmap">
{
  "imports": {
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",

    "react": "https://esm.sh/react@18.2.0",

    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "react/": "https://aistudiocdn.com/react@^19.2.1/"
  }
}
</script>

</head>

    <div id="root"></div>

</html>
